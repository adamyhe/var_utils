[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "var_utils"
version = "0.2.2"
description = """
A collection of small command line tools for handling genetic variants.
"""
authors = [{ name = "Adam He", email = "adamyhe@gmail.com" }]
license = { file = "LICENSE" }
urls = { homepage = "https://github.com/adamyhe/var_utils" }
requires-python = ">= 3.9"
dependencies = ["pandas", "tqdm", "requests", "pyfastx"]

[tool.setuptools]
packages = ["src"]

[project.scripts]
ld_fetch = "src.ld_fetch:main"
lookup_dbsnp = "src.lookup_dbsnp:main"
cleanup_snps = "src.cleanup_snps:main"
match_allele_frequency = "src.match_allele_frequency:main"
